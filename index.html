<!DOCTYPE html>
<html>
<head>
  <title>Potion Meter</title>
  <link rel="icon" href="icon.png" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="/runeappslib.css">
  <link rel="stylesheet" type="text/css" href="/nis/nis.css">
  <script type="text/javascript" src="/runeappslib.js"></script>
  <script type="text/javascript" src="/alt1lib.js"></script>
  <script type="text/javascript" src="newscripts.js"></script>  <!-- We'll inline logic below instead -->
  <style>
    /* Keep XpMeter styles for native look */
    body { font-family: sans-serif; color: #ccc; }
    #outputwrapper { position: absolute; cursor: default; top: 10px; left: 0px; right: 0px; font-size: 24px; text-align: center; height: 28px; z-index: 2; }
    #potoutputinner { display: inline-block; position: relative; white-space: nowrap; overflow: hidden; }
    #potoutputinner.active { background: url('/nis/alt1-currentskin/background.png'); padding: 0px 3px; border: 1px solid rgba(128,128,128,0.5); margin-top: -1px; }
    #potskillicon { width: 28px; height: 28px; display: inline-block; background-image: url('skillicons.png'); vertical-align: bottom; margin-top: -5px; margin-right: -5px; background-position: 0px -476px; }  /* Fixed Herblore icon */
    #potoutput { }
    /* Simple controls */
    #controls { position: absolute; bottom: 10px; left: 10px; right: 10px; text-align: center; }
    button { background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; font-size: 16px; cursor: pointer; border-radius: 4px; }
    button:hover { background: rgba(0,0,0,0.7); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-size: 14px; margin-top: 5px; }
    #lastdrop { font-size: 18px; color: #4ff; }
    #timer { position: absolute; top: 45px; right: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-family: monospace; }
    .transbutton { width: 16px; height: 16px; background-size: cover; cursor: pointer; opacity: 0.8; }
    .transbutton:hover { opacity: 1; }
  </style>
</head>
<body class="nis" onload="initApp()">
  <!-- Info button (optional) -->
  <div id="infobutton" class="transbutton" onclick="showHelp();" title="Help" style="position: absolute; top: 5px; left: 5px; background-image: url('infoicon.png');"></div>
  
  <!-- Main output -->
  <div id="outputwrapper">
    <div id="potoutputinner" onclick="toggleActive()" class="">
      <div id="potskillicon"></div>
      <span id="potoutput">0 potions/hr</span>
    </div>
  </div>
  
  <!-- Timer -->
  <div id="timer">--:--</div>
  
  <!-- Status -->
  <div id="status">
    <span id="lastdrop">Last drop: --</span> | 
    <span id="xphdisplay">-- xp/hr</span>
  </div>
  
  <!-- Controls -->
  <div id="controls">
    <button id="startbtn" onclick="startTracking()">Start</button>
    <button id="stopbtn" onclick="stopTracking()" disabled>Stop</button>
    <button onclick="resetLastDrop()">Manual XP/Pot</button>
  </div>

  <script>
    // Register app
    if (typeof alt1 !== 'undefined') {
      alt1.identifyAppUrl('./appconfig.json');
    }

    let tracking = false;
    let startTime = 0;
    let startHerbloreXp = 0;
    let lastDrop = 0;
    let currentHerbloreXp = 0;
    let updateInterval;

    // Initialize
    function initApp() {
      if (!alt1.hasGamestatePermission()) {
        alert('Grant [Gamestate] permission in Alt1 for RuneMetrics XP!');
        return;
      }
      // Start listeners
      alt1.xpCounterListener('onXpCounters');
      alt1.xpRiseListener('onXpRise');
      updateTimer();  // Initial
      resize();
    }

    // XP Counters callback (from RuneMetrics)
    window.onXpCounters = function(data) {
      console.log('XP Data:', data);  // Debug in Alt1 Dev Console
      currentHerbloreXp = 0;
      
      // Parse Herblore XP total
      if (data && data.counters) {
        for (let counter of data.counters) {
          if (counter.name && counter.name.toLowerCase().includes('herblore')) {
            currentHerbloreXp = parseInt(counter.xp) || 0;
            break;
          }
        }
      } else if (data && data.skills && data.skills[15]) {  // Fallback: Herblore ID 15?
        currentHerbloreXp = data.skills[15];
      }
      
      if (tracking && startHerbloreXp > 0) {
        let timeMs = Date.now() - startTime;
        let hours = timeMs / 3600000;
        let xpGained = currentHerbloreXp - startHerbloreXp;
        let xph = hours > 0 ? xpGained / hours : 0;
        let potsH = lastDrop > 0 ? xph / lastDrop : 0;
        
        document.getElementById('potoutput').textContent = Math.round(potsH) + ' potions/hr';
        document.getElementById('xphdisplay').textContent = Math.round(xph) + ' xp/hr';
        document.getElementById('lastdrop').textContent = 'Last drop: ' + lastDrop.toFixed(1);
        
        // Overlay near XpMeter (adjust x,y)
        if (alt1.hasOverlayPermission()) {
          alt1.clearGroup('potmeter');
          alt1.overlayText(
            `Potions/h: ${Math.round(potsH)} (drop:${lastDrop.toFixed(1)})`,
            0xFFFFFFFF,  // White
            22,  // Size
            50,  // X (drag in Alt1 to position)
            80,  // Y
            0,   // No fade
            'potmeter'
          );
        }
      }
    };

    // XP Rise callback (chat drops: "+242.5")
    window.onXpRise = function(xpStr) {
      console.log('XP Rise:', xpStr);
      lastDrop = parseFloat(xpStr.replace(/[^0-9.]/g, '')) || 0;
      if (tracking) {
        // Trigger display update
        alt1.xpCounterListener('onXpCounters');  // Force poll
      }
    };

    // Start tracking session
    function startTracking() {
      if (!tracking) {
        startTime = Date.now();
        startHerbloreXp = currentHerbloreXp;  // Use latest read
        tracking = true;
        document.getElementById('startbtn').disabled = true;
        document.getElementById('stopbtn').disabled = false;
        document.getElementById('potoutputinner').classList.add('active');
      }
    }

    // Stop
    function stopTracking() {
      tracking = false;
      document.getElementById('startbtn').disabled = false;
      document.getElementById('stopbtn').disabled = true;
      document.getElementById('potoutputinner').classList.remove('active');
      alt1.clearGroup('potmeter');
    }

    // Manual override last drop (fallback)
    function resetLastDrop() {
      let input = prompt('Enter XP per potion (e.g. 242.5):', lastDrop.toFixed(1));
      if (input !== null) {
        lastDrop = parseFloat(input) || 0;
      }
    }

    // Toggle active style
    function toggleActive() {
      document.getElementById('potoutputinner').classList.toggle('active');
    }

    // Simple timer display
    function updateTimer() {
      if (tracking) {
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        let mins = Math.floor(elapsed / 60);
        let secs = elapsed % 60;
        document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      } else {
        document.getElementById('timer').textContent = '--:--';
      }
    }

    // Help popup (using runeappslib)
    function showHelp() {
      alert(
        'Potion Meter\n\n' +
        '• Auto-detects Herblore XP/h from RuneMetrics.\n' +
        '• Uses last chat XP drop for potions/h calc.\n' +
        '• Click Start before session.\n' +
        '• Drag overlay text to position.\n' +
        '• Enable RuneMetrics XP counters in-game.\n' +
        '• Debug: Alt1 toolbar spanner > Dev Console (check console.log)'
      );
    }

    // Resize handler
    function resize() { /* App auto-resizes */ }

    // Update timer every sec
    updateInterval = setInterval(updateTimer, 1000);

    // Window resize
    window.onresize = resize;
  </script>
</body>
</html>
